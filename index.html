<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול מחירון סיגריות</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }

    /* קונטיינר ראשי */
    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* כפתור פתיחת מודאל */
    .btn-main {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    /* שרפרף / הכהיית רקע המודאל */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .modal-overlay.active {
      display: flex;
    }

    /* מודאל רספונסיבי לטלפון */
    .modal-content {
      background-color: #1e293b;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    /* טפסים ושדות במודאל - סידור בטור לנייד */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
    }

    .item-row {
      display: flex;
      flex-direction: column; /* טור במסכים קטנים כדי שלא ייחתך */
      gap: 8px;
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #0f172a;
      color: white;
      font-size: 15px;
    }

    .btn-action {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%; /* רוחב מלא בטלפון */
    }

    .btn-add { background-color: #16a34a; color: white; }
    .btn-save { background-color: #059669; color: white; }
    .btn-delete { background-color: #dc2626; color: white; }
    .btn-whatsapp { background-color: #25d366; color: white; margin-top: 10px; }

    /* מעבר לרוחב שורה במסכים רחבים יותר */
    @media (min-width: 480px) {
      .form-section, .item-row {
        flex-direction: row;
        align-items: center;
      }
      .btn-action {
        width: auto;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-main" onclick="openModal()">ניהול מחירון סיגריות</button>
    
    <!-- כפתור שליחה לוואטסאפ -->
    <button class="btn-main btn-whatsapp" onclick="sendToWhatsApp('0500000000')">שליחת קבלה בוואטסאפ</button>
  </div>

  <!-- חלון צף (Modal) -->
  <div class="modal-overlay" id="priceModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>ניהול מחירון סיגריות</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <!-- הוספת פריט חדש -->
      <div class="form-section">
        <input type="text" id="newName" placeholder="שם הסיגריה / פאקט">
        <input type="number" id="newPrice" placeholder="מחיר">
        <button class="btn-action btn-add" onclick="addItem()">הוסף</button>
      </div>

      <!-- רשימת פריטים לעריכה -->
      <div id="itemsContainer">
        <div class="item-row">
          <input type="text" value="יצחק">
          <input type="number" value="10">
          <button class="btn-action btn-save">שמור</button>
          <button class="btn-action btn-delete">מחק</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('priceModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('priceModal').classList.remove('active');
    }

    // פתיחה ישירה באפליקציית וואטסאפ בנייד
    function sendToWhatsApp(phone) {
      const cleanPhone = phone.replace(/\D/g, '');
      const text = encodeURIComponent("הנה הקבלה/המחירון המעודכן שלך:");
      
      // שימוש בפרוטוקול whatsapp:// לפתיחת האפליקציה הישירה
      window.location.href = `whatsapp://send?phone=${cleanPhone}&text=${text}`;
    }
  </script>
</body>
</html>
